services:
  postgres:
    image: postgres:16-alpine
    container_name: custody-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-custody_gateway}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: custody-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/custody_gateway}
      PORT: ${PORT:-3333}
    ports:
      - '${PORT:-3333}:${PORT:-3333}'
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main.js"
