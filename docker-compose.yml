services:
  postgres:
    image: postgres:16-alpine
    container_name: custody-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: custody_gateway
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: custody-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/custody_gateway
      PORT: '3333'
      CLEARNODE_URL: ${CLEARNODE_URL:-wss://clearnet-sandbox.yellow.com/ws}
      YELLOW_PARTNER_ENABLED: ${YELLOW_PARTNER_ENABLED:-true}
      YELLOW_SIGNER_PRIVATE_KEY: ${YELLOW_SIGNER_PRIVATE_KEY:-}
    env_file:
      - .env
    ports:
      - '3333:3333'
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main.js"
